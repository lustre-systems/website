<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Lustre Systems — cut L glow tile</title>
  <!-- Radial glow, light source off the top left. Degrades gracefully: at small sizes
       it reads as a slightly warmer black rather than turning to mush.
       L is nudged right of geometric centre to compensate for the foot's mass. -->
  <defs>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0%" stop-color="#3A342E"/>
      <stop offset="100%" stop-color="#14110F"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="25%" stop-color="#8E867E"/>
      <stop offset="100%" stop-color="#F2EDE6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <path fill="url(#bone)" transform="translate(152,126) scale(2.2)"
        d="M42 2 L64 0 C52 31 41 67 34 93 C31.8 100.5 34.6 103 43.5 103 H55 L50.5 118 H9 C1 118 -1 113 1 106 C8 75 25 32 42 2 Z M63 103 H96 L100 118 H58.5 Z"/>
</svg>
